<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Nordiska Väsen – Fysik-tärningar (Phaser + Matter)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Phaser 3 (inkl. Matter via Phaser.Physics.Matter) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #2c3e50 0, #000 60%);
      color: #eee;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 0.5rem 1rem;
      font-size: 0.95rem;
      background: rgba(0,0,0,0.7);
      border-bottom: 1px solid #333;
    }
    #controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(0,0,0,0.8);
      border-bottom: 1px solid #333;
    }
    label {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    input[type="number"] {
      width: 4rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      border: 1px solid #555;
      background: #111;
      color: #eee;
    }
    button {
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #666;
      background: #333;
      color: #eee;
      padding: 0.3rem 0.9rem;
      font-size: 0.9rem;
    }
    button:hover {
      background: #444;
    }
    button:active {
      transform: translateY(1px);
    }
    #result {
      text-align: center;
      padding: 0.4rem 0.5rem;
      font-size: 0.9rem;
      min-height: 1.4rem;
    }
    #game-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }
    #game {
      margin: 0 auto;
      max-width: 800px;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-left: 1px solid #222;
      border-right: 1px solid #222;
    }
  </style>
</head>
<body>
<header>
  <strong>Nordiska Väsen – Tärningsskål</strong> · Phaser 3 + Matter.js
</header>

<div id="controls">
  <label>
    Antal tärningar:
    <input type="number" id="diceCount" min="1" max="20" value="8">
  </label>
  <button id="rollBtn">SLÅ!</button>
  <div id="result"></div>
</div>

<div id="game-container">
  <div id="game"></div>
</div>

<script>
  // --- UI elements outside Phaser --------------------------------
  const resultEl = document.getElementById("result");
  const rollBtn = document.getElementById("rollBtn");
  const diceCountInput = document.getElementById("diceCount");

  // --- Phaser config ---------------------------------------------
  const WIDTH = 800;
  const HEIGHT = 450;

  const config = {
    type: Phaser.AUTO,
    width: WIDTH,
    height: HEIGHT,
    parent: "game",
    backgroundColor: "#02060b",
    physics: {
      default: "matter",
      matter: {
        gravity: { y: 1 },
        debug: false
      }
    },
    scene: {
      preload: preload,
      create: create,
      update: update
    }
  };

  const game = new Phaser.Game(config);

  // --- Globals for the scene -------------------------------------
  let sceneRef;
  let diceGroup = [];
  let canRoll = true;
  let rollResolved = false;

  function preload() {
    sceneRef = this;

    // Enkel, generisk tärning: fyrkant med siffror – här skapar vi en
    // spritesheet "on the fly" via graphics + renderTexture.
    // Alternativ: ladda egna bilder via this.load.image().
    const size = 64;
    const rt = this.make.renderTexture({ width: size * 6, height: size, add: false });

    for (let i = 1; i <= 6; i++) {
      const g = this.add.graphics();
      g.fillStyle(0x111111, 1);
      g.fillRoundedRect(0, 0, size - 4, size - 4, 8);
      g.lineStyle(2, 0xffffff, 1);
      g.strokeRoundedRect(0, 0, size - 4, size - 4, 8);

      // Primitiv “pips” layout.
      g.fillStyle(0xffffff, 1);
      const cx = (size - 4) / 2;
      const cy = (size - 4) / 2;
      const off = 12;

      function dot(x, y) {
        g.fillCircle(x, y, 3.5);
      }

      if (i === 1) {
        dot(cx, cy);
      } else if (i === 2) {
        dot(cx - off, cy - off);
        dot(cx + off, cy + off);
      } else if (i === 3) {
        dot(cx - off, cy - off);
        dot(cx, cy);
        dot(cx + off, cy + off);
      } else if (i === 4) {
        dot(cx - off, cy - off);
        dot(cx + off, cy - off);
        dot(cx - off, cy + off);
        dot(cx + off, cy + off);
