<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Nordiska Väsen – Fysik-tärningar (Phaser + Matter)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #2c3e50 0, #000 60%);
      color: #eee;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 0.5rem 1rem;
      font-size: 0.95rem;
      background: rgba(0,0,0,0.7);
      border-bottom: 1px solid #333;
    }
    #controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 1rem;
      background: rgba(0,0,0,0.8);
      border-bottom: 1px solid #333;
    }
    label {
      font-size: 0.9rem;
      opacity: 0.9;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    input[type="number"] {
      width: 4rem;
      padding: 0.3rem 0.4rem;
      border-radius: 4px;
      border: 1px solid #555;
      background: #111;
      color: #eee;
      font-size: 0.95rem;
    }
    button {
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #666;
      background: #333;
      color: #eee;
      padding: 0.4rem 1rem;
      font-size: 0.95rem;
    }
    button:hover {
      background: #444;
    }
    button:active {
      transform: translateY(1px);
    }
    #result {
      text-align: center;
      padding: 0.4rem 0.5rem;
      font-size: 0.9rem;
      min-height: 1.4rem;
      flex: 1 1 100%;
    }
    #game-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 0.5rem 0;
    }
    #game {
      margin: 0 auto;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      border-left: 1px solid #222;
      border-right: 1px solid #222;
    }

    /* 📱 Mobilanpassning */
    @media (max-width: 600px) {
      header {
        font-size: 0.85rem;
        padding: 0.4rem 0.5rem;
      }
      #controls {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
      label {
        justify-content: center;
      }
      button {
        width: 100%;
        max-width: 240px;
        margin: 0 auto;
      }
      #game {
        border-left: none;
        border-right: none;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
<header>
  <strong>Nordiska Väsen – Tärningsskål</strong> · Phaser 3 + Matter.js
</header>

<div id="controls">
  <label>
    Antal tärningar:
    <input type="number" id="diceCount" min="1" max="20" value="8">
  </label>
  <button id="rollBtn">SLÅ!</button>
  <div id="result"></div>
</div>

<div id="game-container">
  <div id="game"></div>
</div>

<script>
  // --- UI utanför Phaser -----------------------------------------
  const resultEl = document.getElementById("result");
  const rollBtn = document.getElementById("rollBtn");
  const diceCountInput = document.getElementById("diceCount");

  const WORLD_WIDTH = 800;
  const WORLD_HEIGHT = 450;

  const config = {
    type: Phaser.AUTO,
    parent: "game",
    backgroundColor: "#02060b",
    physics: {
      default: "matter",
      matter: {
        gravity: { y: 1 },
        debug: false
      }
    },
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH,
      width: WORLD_WIDTH,
      height: WORLD_HEIGHT
    },
    scene: {
      preload: preload,
      create: create,
      update: update
    }
  };

  const game = new Phaser.Game(config);

  let sceneRef;
  let diceGroup = [];
  let canRoll = true;
  let rollResolved = false;

  function preload () {
    sceneRef = this;
    // ingen extern asset-laddning; vi ritar tärningar med Graphics/Text
  }

  function create () {
    // Bakgrund
    const bg = this.add.graphics();
    bg.fillStyle(0x0f1b29, 1);
    bg.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

    // “Skål”: botten + väggar (Matter-statisk)
    const thickness = 40;
    this.matter.add.rectangle(
      WORLD_WIDTH / 2,
      WORLD_HEIGHT - thickness / 2,
      WORLD_WIDTH * 0.8,
      thickness,
      { isStatic: true, chamfer: { radius: 10 } }
    );
    this.matter.add.rectangle(
      WORLD_WIDTH * 0.1,
      WORLD_HEIGHT * 0.6,
      thickness,
      WORLD_HEIGHT * 0.5,
      { isStatic: true }
    );
    this.matter.add.rectangle(
      WORLD_WIDTH * 0.9,
      WORLD_HEIGHT * 0.6,
      thickness,
      WORLD_HEIGHT * 0.5,
      { isStatic: true }
    );

    // Lite synlig ram
    const walls = this.add.graphics();
    walls.lineStyle(2, 0x445566, 0.8);
    walls.strokeRect(WORLD_WIDTH * 0.1, WORLD_HEIGHT * 0.35, WORLD_WIDTH * 0.8, WORLD_HEIGHT * 0.5);

    this.matter.world.setBounds();

    rollBtn.addEventListener("click", () => {
      if (!canRoll) return;
      startRoll();
    });

    resultEl.textContent = "Välj antal tärningar och klicka SLÅ!";
  }

  // Skapa en “tärnings-container” (ruta + text) + Matter-body
  function createDie (x, y, value) {
    const size = 40;

    // ruta
    const rect = sceneRef.add.rectangle(0, 0, size, size, 0xffffff);
    rect.setStrokeStyle(2, 0x000000, 1);

    // siffra
    const label = sceneRef.add.text(0, 0, String(value), {
      fontSize: "20px",
      color: "#000000"
    }).setOrigin(0.5, 0.5);

    // container
    const container = sceneRef.add.container(x, y, [rect, label]);

    // matter-body kopplat till containern
    sceneRef.matter.add.gameObject(container, {
      shape: { type: "rectangle", width: size, height: size }
    });

    container.setBounce(0.4 + Math.random() * 0.3);
    container.setFriction(0.1, 0.005, 0.001);
    container.setFrictionAir(0.02);
    container.setScale(1);

    const forceX = (Math.random() - 0.5) * 0.01;
    const forceY = 0.01 + Math.random() * 0.005;
    container.applyForce({ x: forceX, y: forceY });
    container.setAngularVelocity((Math.random() - 0.5) * 0.3);

    // spara info
    container.logicalValue = value;
    container.rect = rect;
    container.label = label;

    return container;
  }

  function startRoll () {
    const n = clamp(parseInt(diceCountInput.value, 10) || 1, 1, 20);
    diceCountInput.value = n;
    resultEl.textContent = "Tärningarna kastas...";
    canRoll = false;
    rollResolved = false;

    // Ta bort gamla tärningar
    diceGroup.forEach(d => d.destroy());
    diceGroup = [];

    for (let i = 0; i < n; i++) {
      const x = WORLD_WIDTH * 0.3 + Math.random() * WORLD_WIDTH * 0.4;
      const y = 40 + Math.random() * 40;
      const value = Phaser.Math.Between(1, 6);
      const die = createDie(x, y, value);
      diceGroup.push(die);
    }
  }

  function update () {
    if (!diceGroup.length || rollResolved) return;

    const velocityThreshold = 0.15;
    let allResting = true;

    for (const die of diceGroup) {
      const body = die.body;
      if (!body) continue;
      const v = body.velocity;
      const speed = Math.sqrt(v.x * v.x + v.y * v.y);
      if (speed > velocityThreshold) {
        allResting = false;
        break;
      }
    }

    if (allResting) {
      resolveRoll();
    }
  }

  function resolveRoll () {
    if (rollResolved) return;
    rollResolved = true;
    canRoll = true;

    let successes = 0;
    const values = [];

    diceGroup.forEach(die => {
      const value = die.logicalValue || 1;
      values.push(value);
      if (value === 6) successes++;

      // färga 6:or gröna, andra lite grå
      if (die.rect) {
        if (value === 6) {
          die.rect.setFillStyle(0x7bd67b, 1);
        } else {
          die.rect.setFillStyle(0xf0f0f0, 1);
        }
      }
    });

    resultEl.innerHTML =
      `Du slog ${diceGroup.length} tärningar och fick ` +
      `<strong>${successes}</strong> framgång(ar) (6:or).` +
      `<br><span style="opacity:0.7;">[${values.join(", ")}]</span>`;
  }

  function clamp (v, min, max) {
    return Math.max(min, Math.min(max, v));
  }
</script>
</body>
</html>
