<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fast OSM Network</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fff; font-family: sans-serif; }
        #controls { position: absolute; top: 15px; left: 15px; z-index: 10; background: white; padding: 12px; border: 1px solid #000; }
        input { padding: 5px; border: 1px solid #000; width: 150px; }
        button { cursor: pointer; background: #000; color: #fff; border: none; padding: 5px 10px; }
        #status { font-size: 11px; margin-top: 5px; text-transform: uppercase; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

<div id="controls">
    <input type="text" id="cityInput" placeholder="City (e.g. Milan)">
    <button onclick="loadCity()">LOAD</button>
    <div id="status">Ready</div>
</div>
<canvas id="bgCanvas"></canvas>
<canvas id="fgCanvas"></canvas>

<script>
    const bgCanvas = document.getElementById('bgCanvas');
    const fgCanvas = document.getElementById('fgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const fgCtx = fgCanvas.getContext('2d');
    
    let graph = {}, nodes = {}, isRunning = false;
    let currentNodeId = null, targetNodeId = null, progress = 0;

    function resize() {
        bgCanvas.width = fgCanvas.width = window.innerWidth;
        bgCanvas.height = fgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    async function loadCity() {
        const city = document.getElementById('cityInput').value;
        const status = document.getElementById('status');
        if (!city) return;

        isRunning = false;
        status.innerText = "Locating...";

        try {
            const geo = await fetch(`https://nominatim.openstreetmap.org/search?city=${encodeURIComponent(city)}&format=json&limit=1`).then(r => r.json());
            if (!geo.length) throw new Error("Not found");

            const b = geo[0].boundingbox;
            // OPTIMIZED QUERY: Only major roads, no residential/service roads to save data
            const query = `[out:json][timeout:20];way["highway"~"primary|secondary|tertiary"](${b[0]},${b[2]},${b[1]},${b[3]});(._;>;);out skel;`;

            status.innerText = "Fetching major roads...";
            const osmRes = await fetch(`https://overpass-api.de/api/interpreter`, {
                method: 'POST',
                body: `data=${encodeURIComponent(query)}`
            });
            const data = await osmRes.json();
            
            parseAndRender(data, b);
        } catch (e) {
            status.innerText = "Error: " + e.message;
        }
    }

    function parseAndRender(data, b) {
        graph = {}; nodes = {};
        const [minLat, maxLat, minLon, maxLon] = [parseFloat(b[0]), parseFloat(b[1]), parseFloat(b[2]), parseFloat(b[3])];

        data.elements.forEach(el => {
            if (el.type === 'node') {
                nodes[el.id] = {
                    x: ((el.lon - minLon) / (maxLon - minLon)) * bgCanvas.width,
                    y: (1 - (el.lat - minLat) / (maxLat - minLat)) * bgCanvas.height
                };
            }
        });

        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        bgCtx.strokeStyle = "#eee"; // Very light grey
        bgCtx.lineWidth = 1;
        bgCtx.beginPath();

        data.elements.forEach(el => {
            if (el.type === 'way' && el.nodes) {
                for (let i = 0; i < el.nodes.length - 1; i++) {
                    const u = el.nodes[i], v = el.nodes[i+1];
                    if (nodes[u] && nodes[v]) {
                        bgCtx.moveTo(nodes[u].x, nodes[u].y);
                        bgCtx.lineTo(nodes[v].x, nodes[v].y);
                        if (!graph[u]) graph[u] = [];
                        if (!graph[v]) graph[v] = [];
                        graph[u].push(v); graph[v].push(u);
                    }
                }
            }
        });
        bgCtx.stroke();

        const ids = Object.keys(graph);
        if (ids.length) {
            currentNodeId = ids[Math.floor(Math.random() * ids.length)];
            pickNext();
            isRunning = true;
            document.getElementById('status').innerText = "Scanning network...";
            animate();
        }
    }

    function pickNext() {
        const neighbors = graph[currentNodeId];
        targetNodeId = neighbors[Math.floor(Math.random() * neighbors.length)];
        progress = 0;
    }

    function animate() {
        if (!isRunning) return;

        // Clear only the foreground (the moving black dot)
        fgCtx.clearRect(0, 0, fgCanvas.width, fgCanvas.height);

        const start = nodes[currentNodeId];
        const end = nodes[targetNodeId];

        const curX = start.x + (end.x - start.x) * progress;
        const curY = start.y + (end.y - start.y) * progress;

        // Draw current segment
        fgCtx.strokeStyle = "black";
        fgCtx.lineWidth = 2;
        fgCtx.beginPath();
        fgCtx.moveTo(start.x, start.y);
        fgCtx.lineTo(curX, curY);
        fgCtx.stroke();

        // Draw pulse
        fgCtx.fillStyle = "black";
        fgCtx.beginPath();
        fgCtx.arc(curX, curY, 4, 0, Math.PI * 2);
        fgCtx.fill();

        progress += 0.15; // Faster speed
        if (progress >= 1) {
            currentNodeId = targetNodeId;
            pickNext();
        }
        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
