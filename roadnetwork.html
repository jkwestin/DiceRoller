<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OSM Explorer - Forward Bias</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fff; font-family: monospace; }
        #controls { position: absolute; top: 15px; left: 15px; z-index: 10; background: #fff; padding: 12px; border: 1px solid #000; box-shadow: 4px 4px 0 #000; }
        input { border: 1px solid #000; padding: 5px; outline: none; }
        button { cursor: pointer; background: #000; color: #fff; border: none; padding: 5px 10px; font-weight: bold; }
        #status { font-size: 10px; margin-top: 5px; color: #666; }
        canvas { position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

<div id="controls">
    <strong>NET_SCANNER v2</strong><br><br>
    <input type="text" id="cityInput" placeholder="CITY NAME">
    <button onclick="loadCity()">SCAN</button>
    <div id="status">IDLE</div>
</div>
<canvas id="bgCanvas"></canvas>
<canvas id="fgCanvas"></canvas>

<script>
    const bgCanvas = document.getElementById('bgCanvas');
    const fgCanvas = document.getElementById('fgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const fgCtx = fgCanvas.getContext('2d');
    
    let graph = {}, nodes = {}, isRunning = false;
    let currentNodeId = null, targetNodeId = null, previousNodeId = null, progress = 0;

    window.addEventListener('resize', () => {
        bgCanvas.width = fgCanvas.width = window.innerWidth;
        bgCanvas.height = fgCanvas.height = window.innerHeight;
    });
    window.dispatchEvent(new Event('resize'));

    async function loadCity() {
        const city = document.getElementById('cityInput').value;
        if (!city) return;
        isRunning = false;
        document.getElementById('status').innerText = "LOCATING...";

        try {
            const geo = await fetch(`https://nominatim.openstreetmap.org/search?city=${encodeURIComponent(city)}&format=json&limit=1`).then(r => r.json());
            if (!geo.length) throw new Error("CITY NOT FOUND");

            const b = geo[0].boundingbox;
            // High-speed query: Primary/Secondary/Tertiary only
            const query = `[out:json][timeout:20];way["highway"~"primary|secondary|tertiary"](${b[0]},${b[2]},${b[1]},${b[3]});(._;>;);out skel;`;

            document.getElementById('status').innerText = "DOWNLOADING ROAD_NET...";
            const osmRes = await fetch(`https://overpass-api.de/api/interpreter`, {
                method: 'POST',
                body: `data=${encodeURIComponent(query)}`
            });
            const data = await osmRes.json();
            
            setupNetwork(data, b);
        } catch (e) {
            document.getElementById('status').innerText = "ERR: " + e.message;
        }
    }

    function setupNetwork(data, b) {
        graph = {}; nodes = {};
        const [minLat, maxLat, minLon, maxLon] = [parseFloat(b[0]), parseFloat(b[1]), parseFloat(b[2]), parseFloat(b[3])];

        data.elements.forEach(el => {
            if (el.type === 'node') {
                nodes[el.id] = {
                    x: ((el.lon - minLon) / (maxLon - minLon)) * bgCanvas.width,
                    y: (1 - (el.lat - minLat) / (maxLat - minLat)) * bgCanvas.height
                };
            }
        });

        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        bgCtx.strokeStyle = "#f0f0f0"; // Ghost network
        bgCtx.lineWidth = 1;
        bgCtx.beginPath();

        data.elements.forEach(el => {
            if (el.type === 'way' && el.nodes) {
                for (let i = 0; i < el.nodes.length - 1; i++) {
                    const u = el.nodes[i], v = el.nodes[i+1];
                    if (nodes[u] && nodes[v]) {
                        bgCtx.moveTo(nodes[u].x, nodes[u].y);
                        bgCtx.lineTo(nodes[v].x, nodes[v].y);
                        if (!graph[u]) graph[u] = [];
                        if (!graph[v]) graph[v] = [];
                        graph[u].push(v); graph[v].push(u);
                    }
                }
            }
        });
        bgCtx.stroke();

        const ids = Object.keys(graph);
        if (ids.length) {
            currentNodeId = ids[Math.floor(Math.random() * ids.length)];
            previousNodeId = null;
            pickNext();
            isRunning = true;
            document.getElementById('status').innerText = "SCANNING...";
            animate();
        }
    }

    function pickNext() {
        const neighbors = graph[currentNodeId];
        if (!neighbors) return;

        // Logic: Try to avoid the node we just came from
        const options = neighbors.filter(id => id !== previousNodeId);
        const nextId = (options.length > 0) 
            ? options[Math.floor(Math.random() * options.length)] 
            : neighbors[0]; // Forced backtrack

        previousNodeId = currentNodeId;
        targetNodeId = nextId;
        progress = 0;
    }

    function animate() {
        if (!isRunning) return;
        fgCtx.clearRect(0, 0, fgCanvas.width, fgCanvas.height);

        const start = nodes[currentNodeId];
        const end = nodes[targetNodeId];

        const curX = start.x + (end.x - start.x) * progress;
        const curY = start.y + (end.y - start.y) * progress;

        // Path trail
        fgCtx.strokeStyle = "black";
        fgCtx.lineWidth = 2.5;
        fgCtx.beginPath();
        fgCtx.moveTo(start.x, start.y);
        fgCtx.lineTo(curX, curY);
        fgCtx.stroke();

        // Scanner Head
        fgCtx.fillStyle = "black";
        fgCtx.beginPath();
        fgCtx.arc(curX, curY, 4, 0, Math.PI * 2);
        fgCtx.fill();

        progress += 0.12; 
        if (progress >= 1) {
            currentNodeId = targetNodeId;
            pickNext();
        }
        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
