<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OSM Network Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fff; font-family: sans-serif; }
        #controls { position: absolute; top: 15px; left: 15px; z-index: 10; background: white; padding: 15px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 180px; }
        button { padding: 8px 12px; background: #000; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        #status { font-size: 12px; color: #666; margin-top: 8px; }
    </style>
</head>
<body>

<div id="controls">
    <input type="text" id="cityInput" placeholder="City Name (e.g., Paris)">
    <button onclick="loadCity()">Load Map</button>
    <div id="status">Enter a city to begin.</div>
</div>
<canvas id="mapCanvas"></canvas>

<script>
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    let graph = {};
    let nodes = {};
    let allEdges = []; // Store for background rendering
    let currentNodeId = null;
    let targetNodeId = null;
    let progress = 0;
    let isRunning = false;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    async function loadCity() {
        const cityName = document.getElementById('cityInput').value;
        const status = document.getElementById('status');
        if (!cityName) return;

        isRunning = false;
        status.innerText = "Searching city...";

        try {
            const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?city=${encodeURIComponent(cityName)}&format=json&limit=1`);
            const geoData = await geoRes.json();
            if (!geoData.length) throw new Error("City not found.");

            const bbox = geoData[0].boundingbox;
            // Get roads: primary, secondary, tertiary, and residential
            const query = `[out:json][timeout:30];
                way["highway"~"primary|secondary|tertiary|residential"](${bbox[0]},${bbox[2]},${bbox[1]},${bbox[3]});
                (._;>;);
                out body;`;

            status.innerText = "Downloading network...";
            const osmRes = await fetch(`https://overpass-api.de/api/interpreter`, {
                method: 'POST',
                body: `data=${encodeURIComponent(query)}`
            });

            if (!osmRes.ok) throw new Error("API Overloaded. Try again in 10s.");
            const osmData = await osmRes.json();
            processData(osmData, bbox);
        } catch (e) {
            status.innerText = "Error: " + e.message;
        }
    }

    function processData(data, bbox) {
        graph = {};
        nodes = {};
        allEdges = [];
        const minLat = parseFloat(bbox[0]), maxLat = parseFloat(bbox[1]);
        const minLon = parseFloat(bbox[2]), maxLon = parseFloat(bbox[3]);

        // 1. Map Nodes
        data.elements.forEach(el => {
            if (el.type === 'node') {
                nodes[el.id] = {
                    x: ((el.lon - minLon) / (maxLon - minLon)) * canvas.width,
                    y: (1 - (el.lat - minLat) / (maxLat - minLat)) * canvas.height
                };
            }
        });

        // 2. Build Graph & Edge List
        data.elements.forEach(el => {
            if (el.type === 'way' && el.nodes) {
                for (let i = 0; i < el.nodes.length - 1; i++) {
                    const u = el.nodes[i], v = el.nodes[i+1];
                    if (nodes[u] && nodes[v]) {
                        if (!graph[u]) graph[u] = [];
                        if (!graph[v]) graph[v] = [];
                        graph[u].push(v);
                        graph[v].push(u);
                        allEdges.push([nodes[u], nodes[v]]);
                    }
                }
            }
        });

        const nodeIds = Object.keys(graph);
        if (nodeIds.length === 0) return;

        currentNodeId = nodeIds[Math.floor(Math.random() * nodeIds.length)];
        pickNextTarget();
        
        // Initial Draw
        drawBackground();
        
        document.getElementById('status').innerText = "Network loaded. Scanning...";
        isRunning = true;
        animate();
    }

    function drawBackground() {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = "#e0e0e0"; // Light Grey Network
        ctx.lineWidth = 1;
        ctx.beginPath();
        allEdges.forEach(edge => {
            ctx.moveTo(edge[0].x, edge[0].y);
            ctx.lineTo(edge[1].x, edge[1].y);
        });
        ctx.stroke();
    }

    function pickNextTarget() {
        const neighbors = graph[currentNodeId];
        targetNodeId = neighbors[Math.floor(Math.random() * neighbors.length)];
        progress = 0;
    }

    function animate() {
        if (!isRunning) return;

        // We don't want to fade the background, so we re-draw it every frame
        // or draw the "trail" on a separate layer. For simplicity, we just 
        // draw the background and the moving pulse.
        drawBackground();

        if (currentNodeId && targetNodeId) {
            const start = nodes[currentNodeId];
            const end = nodes[targetNodeId];

            const curX = start.x + (end.x - start.x) * progress;
            const curY = start.y + (end.y - start.y) * progress;

            // Draw current path in Black
            ctx.beginPath();
            ctx.strokeStyle = "black";
            ctx.lineWidth = 3;
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(curX, curY);
            ctx.stroke();

            // Draw Radar Head
            ctx.beginPath();
            ctx.arc(curX, curY, 5, 0, Math.PI * 2);
            ctx.fillStyle = "black";
            ctx.fill();

            progress += 0.1; 

            if (progress >= 1) {
                currentNodeId = targetNodeId;
                pickNextTarget();
            }
        }

        requestAnimationFrame(animate);
    }
</script>

</body>
</html>
