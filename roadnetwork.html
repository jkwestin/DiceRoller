<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OSM Radar Network - Fixed</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fff; font-family: 'Courier New', Courier, monospace; }
        #controls { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(255,255,255,0.9); padding: 15px; border: 2px solid #000; box-shadow: 5px 5px 0px #ccc; }
        input { border: 1px solid #000; padding: 8px; width: 200px; outline: none; }
        button { cursor: pointer; background: #000; color: #fff; border: none; padding: 8px 15px; font-weight: bold; }
        button:hover { background: #333; }
        #status { font-size: 11px; margin-top: 10px; color: #555; max-width: 250px; }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="controls">
    <strong>SYSTEM SCANNER</strong><br><br>
    <input type="text" id="cityInput" placeholder="Enter City (e.g. London)">
    <button onclick="loadCity()">SCAN</button>
    <div id="status">Ready for input.</div>
</div>
<canvas id="mapCanvas"></canvas>

<script>
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    let graph = {};
    let nodes = {};
    let currentNodeId = null;
    let targetNodeId = null;
    let progress = 0;
    let isRunning = false;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });


    async function loadCity() {
    const cityName = document.getElementById('cityInput').value;
    console.log("Starting scan for:", cityName);
    
    try {
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?city=${encodeURIComponent(cityName)}&format=json&limit=1`);
        const geoData = await geoRes.json();
        
        if (!geoData.length) {
            alert("Nominatim could not find this city.");
            return;
        }
        console.log("City found at:", geoData[0].lat, geoData[0].lon);

        const bbox = geoData[0].boundingbox;
        const query = `[out:json][timeout:25];way["highway"](${bbox[0]},${bbox[2]},${bbox[1]},${bbox[3]});(._;>;);out body;`;
        
        console.log("Sending query to Overpass...");
        const osmRes = await fetch(`https://overpass-api.de/api/interpreter`, {
            method: 'POST',
            body: `data=${encodeURIComponent(query)}`
        });

        if (!osmRes.ok) {
            const err = await osmRes.text();
            console.error("Overpass Error:", err);
            alert("Overpass API is angry. See console.");
            return;
        }

        const osmData = await osmRes.json();
        console.log("Data received! Elements:", osmData.elements.length);

        if (osmData.elements.length === 0) {
            alert("No roads found in this bounding box.");
            return;
        }

        processData(osmData, bbox);
    } catch (e) {
        console.error("Script crashed:", e);
        alert("Check console for: " + e.message);
    }
}
    
    async function loadCity1() {
        const cityName = document.getElementById('cityInput').value;
        const status = document.getElementById('status');
        if (!cityName) return;

        isRunning = false; // Stop current animation
        status.innerText = "LOCATING GEOGRAPHIC BOUNDS...";
        
        try {
            // 1. Get Coordinates
            const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?city=${encodeURIComponent(cityName)}&format=json&limit=1`);
            const geoData = await geoRes.json();
            if (!geoData.length) throw new Error("City not found in database.");
            
            const bbox = geoData[0].boundingbox; // [minlat, maxlat, minlon, maxlon]
            
            // 2. Query Overpass with explicit JSON formatting and shorter timeout
            const query = `[out:json][timeout:30];
                way["highway"](${bbox[0]},${bbox[2]},${bbox[1]},${bbox[3]});
                (._;>;);
                out body;`;
            
            status.innerText = "REQUESTING NETWORK DATA (THIS MAY TAKE 10s)...";
            
            const osmRes = await fetch(`https://overpass-api.de/api/interpreter`, {
                method: 'POST',
                body: `data=${encodeURIComponent(query)}`
            });

            // Check if server returned 200 OK
            if (!osmRes.ok) {
                throw new Error(`Server Error: ${osmRes.status}. The API might be busy.`);
            }

            // Read as text first to verify it's not HTML/XML
            const rawData = await osmRes.text();
            if (rawData.trim().startsWith("<")) {
                throw new Error("Server returned XML/HTML instead of JSON. Try a smaller area.");
            }

            const osmData = JSON.parse(rawData);
            if (!osmData.elements || osmData.elements.length === 0) {
                throw new Error("No road data found for this area.");
            }

            processData(osmData, bbox);
        } catch (e) {
            status.innerText = "CRITICAL ERROR: " + e.message;
            console.error(e);
        }
    }

    function processData(data, bbox) {
        graph = {};
        nodes = {};
        const minLat = parseFloat(bbox[0]), maxLat = parseFloat(bbox[1]);
        const minLon = parseFloat(bbox[2]), maxLon = parseFloat(bbox[3]);

        data.elements.forEach(el => {
            if (el.type === 'node') {
                nodes[el.id] = {
                    x: ((el.lon - minLon) / (maxLon - minLon)) * canvas.width,
                    y: (1 - (el.lat - minLat) / (maxLat - minLat)) * canvas.height
                };
            }
        });

        data.elements.forEach(el => {
            if (el.type === 'way' && el.nodes) {
                for (let i = 0; i < el.nodes.length - 1; i++) {
                    const u = el.nodes[i], v = el.nodes[i+1];
                    if (nodes[u] && nodes[v]) {
                        if (!graph[u]) graph[u] = [];
                        if (!graph[v]) graph[v] = [];
                        graph[u].push(v);
                        graph[v].push(u);
                    }
                }
            }
        });

        const nodeIds = Object.keys(graph);
        if (nodeIds.length === 0) {
            document.getElementById('status').innerText = "ERROR: Network is empty.";
            return;
        }

        currentNodeId = nodeIds[Math.floor(Math.random() * nodeIds.length)];
        pickNextTarget();
        
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        document.getElementById('status').innerText = "SCANNING: " + nodeIds.length + " NODES FOUND.";
        isRunning = true;
        animate();
    }

    function pickNextTarget() {
        const neighbors = graph[currentNodeId];
        if (neighbors && neighbors.length > 0) {
            targetNodeId = neighbors[Math.floor(Math.random() * neighbors.length)];
        }
        progress = 0;
    }

    function animate() {
        if (!isRunning) return;

        // Fading trail effect
        ctx.fillStyle = "rgba(255, 255, 255, 0.04)"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (currentNodeId && targetNodeId) {
            const start = nodes[currentNodeId];
            const end = nodes[targetNodeId];

            const curX = start.x + (end.x - start.x) * progress;
            const curY = start.y + (end.y - start.y) * progress;

            // Draw the movement
            ctx.beginPath();
            ctx.moveTo(start.x + (end.x - start.x) * (progress - 0.1), start.y + (end.y - start.y) * (progress - 0.1));
            ctx.lineTo(curX, curY);
            ctx.strokeStyle = "black";
            ctx.lineWidth = 2;
            ctx.lineCap = "round";
            ctx.stroke();

            // Draw the "Radar Point"
            ctx.beginPath();
            ctx.arc(curX, curY, 4, 0, Math.PI * 2);
            ctx.fillStyle = "black";
            ctx.fill();

            progress += 0.08; // Movement speed

            if (progress >= 1) {
                currentNodeId = targetNodeId;
                pickNextTarget();
            }
        }

        requestAnimationFrame(animate);
    }
</script>

</body>
</html>
