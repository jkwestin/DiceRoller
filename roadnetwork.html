<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OSM Explorer - Advanced Logic</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fff; font-family: monospace; }
        #controls { 
            position: absolute; top: 15px; left: 15px; z-index: 10; 
            background: #fff; padding: 15px; border: 2px solid #000; 
        }
        input { border: 1px solid #000; padding: 8px; width: 200px; outline: none; }
        button { 
            cursor: pointer; background: #000; color: #fff; border: none; 
            padding: 8px 15px; font-weight: bold; vertical-align: top;
        }
        #status { font-size: 10px; margin-top: 8px; color: #666; text-transform: uppercase; }
        canvas { position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

<div id="controls">
    <strong>NET_SCANNER_V3</strong><br><br>
    <input type="text" id="cityInput" placeholder="CITY NAME" onkeyup="if(event.key==='Enter') loadCity()">
    <button onclick="loadCity()">SCAN</button>
    <div id="status">IDLE</div>
</div>
<canvas id="bgCanvas"></canvas>
<canvas id="fgCanvas"></canvas>

<script>
    const bgCanvas = document.getElementById('bgCanvas');
    const fgCanvas = document.getElementById('fgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const fgCtx = fgCanvas.getContext('2d');
    
    let graph = {}, nodes = {}, isRunning = false;
    let currentNodeId = null, targetNodeId = null, progress = 0;
    
    // History to prevent local loops
    let visitedHistory = []; 
    const MAX_HISTORY = 15;

    function resize() {
        bgCanvas.width = fgCanvas.width = window.innerWidth;
        bgCanvas.height = fgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    async function loadCity() {
        const city = document.getElementById('cityInput').value;
        if (!city) return;
        
        isRunning = false;
        visitedHistory = []; 
        document.getElementById('status').innerText = "ESTABLISHING UPLINK...";

        try {
            const geo = await fetch(`https://nominatim.openstreetmap.org/search?city=${encodeURIComponent(city)}&format=json&limit=1`).then(r => r.json());
            if (!geo.length) throw new Error("LOC_NOT_FOUND");

            const b = geo[0].boundingbox;
            const query = `[out:json][timeout:25];way["highway"~"primary|secondary|tertiary"](${b[0]},${b[2]},${b[1]},${b[3]});(._;>;);out skel;`;

            document.getElementById('status').innerText = "DOWNLOADING ROAD_DATA...";
            const osmRes = await fetch(`https://overpass-api.de/api/interpreter`, {
                method: 'POST',
                body: `data=${encodeURIComponent(query)}`
            });
            const data = await osmRes.json();
            
            setupNetwork(data, b);
        } catch (e) {
            document.getElementById('status').innerText = "ERR: " + e.message;
        }
    }

    function setupNetwork(data, b) {
        graph = {}; nodes = {};
        const [minLat, maxLat, minLon, maxLon] = [parseFloat(b[0]), parseFloat(b[1]), parseFloat(b[2]), parseFloat(b[3])];

        data.elements.forEach(el => {
            if (el.type === 'node') {
                nodes[el.id] = {
                    x: ((el.lon - minLon) / (maxLon - minLon)) * bgCanvas.width,
                    y: (1 - (el.lat - minLat) / (maxLat - minLat)) * bgCanvas.height
                };
            }
        });

        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        bgCtx.strokeStyle = "#eee"; 
        bgCtx.lineWidth = 1;
        bgCtx.beginPath();

        data.elements.forEach(el => {
            if (el.type === 'way' && el.nodes) {
                for (let i = 0; i < el.nodes.length - 1; i++) {
                    const u = el.nodes[i], v = el.nodes[i+1];
                    if (nodes[u] && nodes[v]) {
                        bgCtx.moveTo(nodes[u].x, nodes[u].y);
                        bgCtx.lineTo(nodes[v].x, nodes[v].y);
                        if (!graph[u]) graph[u] = [];
                        if (!graph[v]) graph[v] = [];
                        graph[u].push(v); graph[v].push(u);
                    }
                }
            }
        });
        bgCtx.stroke();

        const ids = Object.keys(graph);
        if (ids.length) {
            currentNodeId = ids[Math.floor(Math.random() * ids.length)];
            pickNext();
            isRunning = true;
            document.getElementById('status').innerText = "SCANNING ACTIVE";
            animate();
        }
    }

    function pickNext() {
        const neighbors = graph[currentNodeId];
        if (!neighbors) return;

        // Filter: nodes we haven't visited in the last 15 steps
        const novelOptions = neighbors.filter(id => !visitedHistory.includes(id));
        
        let nextId;
        if (novelOptions.length > 0) {
            nextId = novelOptions[Math.floor(Math.random() * novelOptions.length)];
        } else {
            // If all neighbors were visited recently, just pick one that isn't the immediate last
            const immediateLast = visitedHistory[visitedHistory.length - 1];
            const backOptions = neighbors.filter(id => id !== immediateLast);
            nextId = backOptions.length > 0 ? backOptions[0] : neighbors[0];
        }

        // Update History
        visitedHistory.push(currentNodeId);
        if (visitedHistory.length > MAX_HISTORY) visitedHistory.shift();

        targetNodeId = nextId;
        progress = 0;
    }

    function animate() {
        if (!isRunning) return;
        fgCtx.clearRect(0, 0, fgCanvas.width, fgCanvas.height);

        const start = nodes[currentNodeId];
        const end = nodes[targetNodeId];

        const curX = start.x + (end.x - start.x) * progress;
        const curY = start.y + (end.y - start.y) * progress;

        fgCtx.strokeStyle = "#000";
        fgCtx.lineWidth = 3;
        fgCtx.lineCap = "round";
        fgCtx.beginPath();
        fgCtx.moveTo(start.x, start.y);
        fgCtx.lineTo(curX, curY);
        fgCtx.stroke();

        fgCtx.fillStyle = "#000";
        fgCtx.beginPath();
        fgCtx.arc(curX, curY, 5, 0, Math.PI * 2);
        fgCtx.fill();

        progress += 0.1; 
        if (progress >= 1) {
            currentNodeId = targetNodeId;
            pickNext();
        }
        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
